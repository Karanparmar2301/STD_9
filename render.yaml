services:
  # Backend only (free-safe): deploy frontend on Vercel.
  - type: web
    name: student-dashboard-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: CORS_ORIGINS
        value: "https://__VERCEL_APP__.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
      - key: CORS_ORIGIN_REGEX
        value: "^https://([a-zA-Z0-9-]+\\.)*vercel\\.app$|^https://([a-zA-Z0-9-]+\\.)*onrender\\.com$"
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false

    # Free Render web services do not support persistent disks.
    # Any local file writes are ephemeral on restart/redeploy/spin-down.
